name: project-history-agent-ci

on:
  push:
    branches: ["project-history-agent-v0.6", "English"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m compileall -q project_history_agent.py project_history_journal.py project_history_auditor.py project_history_hooks.py project_history_doctor.py history_adapters.py
      - name: Repository smoke
        run: python -m unittest -v tests.test_repository_smoke tests.test_host_native_adapters tests.test_segmented_journal
      - name: Structural audit
        run: python project_history_auditor.py PROJECT_MEMORY.json --json
      - name: Doctor
        run: python project_history_doctor.py . --no-screenshot-probe
