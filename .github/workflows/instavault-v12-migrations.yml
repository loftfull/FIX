name: InstaVault v1.2 migration probe

on:
  pull_request:
    branches:
      - preview/instavault-v1.1
    paths:
      - '.github/workflows/instavault-v12-migrations.yml'
      - '.release/instavault/package.json'

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: instavault
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: instavault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U instavault -d instavault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://instavault:testpass@127.0.0.1:5432/instavault?schema=public
    defaults:
      run:
        working-directory: .release/instavault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          registry-url: 'https://registry.npmjs.org'
      - name: Restore exact Prisma source and migrations
        shell: bash
        run: |
          echo '' | base64 -d > prisma.tgz
          tar -xzf prisma.tgz
          test -f prisma/schema.prisma
          test -f prisma/migrations/20260922160000_add_observability_quality/migration.sql
      - name: Resolve exact dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Prisma validate and generate
        run: |
          npx prisma validate --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma
      - name: Deploy complete migration chain
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Verify pgvector and migrated schema
        shell: bash
        run: |
          psql "postgresql://instavault:testpass@127.0.0.1:5432/instavault" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector') THEN
              RAISE EXCEPTION 'pgvector extension missing';
            END IF;
            IF (SELECT COUNT(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL) <> 7 THEN
              RAISE EXCEPTION 'expected 7 completed Prisma migrations';
            END IF;
            IF to_regclass('"PostEmbedding"') IS NULL OR to_regclass('"PostChunk"') IS NULL OR to_regclass('"ProcessingAttempt"') IS NULL THEN
              RAISE EXCEPTION 'expected migrated tables missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE indexname = 'PostEmbedding_embedding_hnsw_idx') THEN
              RAISE EXCEPTION 'PostEmbedding HNSW index missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE indexname = 'PostChunk_embedding_hnsw_idx') THEN
              RAISE EXCEPTION 'PostChunk HNSW index missing';
            END IF;
          END $$;
          SQL
