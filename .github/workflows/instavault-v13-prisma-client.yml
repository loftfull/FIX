name: InstaVault v1.3 Prisma client artifact

on:
  pull_request:
    branches:
      - preview/instavault-v1.2
    paths:
      - '.github/workflows/instavault-v13-prisma-client.yml'
      - '.release/v13deps/package.json'

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .release/v13deps
    env:
      DATABASE_URL: postgresql://u:p@127.0.0.1:5432/dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          registry-url: 'https://registry.npmjs.org'
      - name: Resolve and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Restore exact Prisma schema
        run: |
          mkdir -p prisma
          echo '' | base64 -d > prisma/schema.prisma
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Pack generated client
        run: tar -czf ../instavault-prisma-client.tgz node_modules/.prisma/client
      - uses: actions/upload-artifact@v4
        with:
          name: instavault-v13-prisma-client
          path: .release/instavault-prisma-client.tgz
          if-no-files-found: error
          retention-days: 1
